<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanks!</title>
<style>
html,body{margin:0;height:100%;background:#fff;color:#000;font-family:monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{max-width:96%;max-height:calc(100% - 50px);border:2px solid #000;cursor:crosshair;background:#fff}
p{margin:8px;font-size:12px;text-align:center}
</style></head><body>
<canvas id="c" width="800" height="600"></canvas>
<p>WASD / arrows: move · Mouse: aim · Click: fire · Space / right-click: mine · Shop: click a row or press 1–7</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=560,OY=40,T=40,C=20,RW=14,R=14;
let g,player,enemies=[],bullets=[],mines=[],fx=[],wrecks=[],coinsArr=[];
let state='title',mission=1,lives=3,kills=0,timer=0,bonus=false,keys={},mx=400,my=200,rawX=0,rawY=0;
let coins=9999,coinsStart=99999,shield=99999,gained=0;
let ups={bounce:0,ammo:0,bspeed:0,speed:999,explosive:0};
const TYPES=[
{sp:0,bs:3,bn:1,cd:110,mb:1,ml:0},
{sp:1,bs:3,bn:1,cd:90,mb:1,ml:0},
{sp:1.1,bs:5,bn:1,cd:80,mb:2,ml:0},
{sp:1.6,bs:3.5,bn:1,cd:90,mb:2,ml:1},
{sp:1.2,bs:4,bn:2,cd:45,mb:3,ml:0},
{sp:1.4,bs:5,bn:2,cd:30,mb:4,ml:0}];
const ITEMS=[
{k:'shield',n:'Shield',d:'Absorbs one hit (stacks to 3)',max:3,base:25,flat:1},
{k:'life',n:'Extra life',d:'+1 life (max 9)',max:9,base:60,flat:1},
{k:'bounce',n:'Extra bounce',d:'Your shells bounce one more time',max:3,base:30},
{k:'explosive',n:'Explosive shell',d:'Shells blow up on impact (hurts enemies only)',max:1,base:80},
{k:'ammo',n:'Extra ammo',d:'+1 shell on screen at once',max:3,base:30},
{k:'bspeed',n:'Fast shells',d:'Shells fly 25% faster',max:2,base:25},
{k:'speed',n:'Engine',d:'Tank moves 10% faster',max:3,base:25}];
function lvl(it){return it.k==='shield'?shield:it.k==='life'?lives:ups[it.k]}
function cost(it){return it.flat?it.base:it.base*(ups[it.k]+1)}
function canBuy(it){return coins>=cost(it)&&lvl(it)<it.max}
function buy(i){const it=ITEMS[i];if(!it||!canBuy(it))return;coins-=cost(it);
 if(it.k==='shield')shield++;else if(it.k==='life')lives++;else ups[it.k]++}
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function wallAt(x,y){return x<0||y<0||x>=W||y>=H||g[y/T|0][x/T|0]===1}
function hit(x,y,r){
 if(x<r||y<r||x>W-r||y>H-r)return true;
 for(let cy=Math.floor((y-r)/T);cy<=Math.floor((y+r)/T);cy++)for(let cx=Math.floor((x-r)/T);cx<=Math.floor((x+r)/T);cx++){
  if(cx<C&&cy<RW&&g[cy][cx]){const px=Math.max(cx*T,Math.min(x,cx*T+T)),py=Math.max(cy*T,Math.min(y,cy*T+T));if((x-px)**2+(y-py)**2<r*r)return true}}
 return false}
function alive(){return[player,...enemies].filter(t=>!t.dead)}
function tankHit(o,x,y){return alive().some(t=>t!==o&&(t.x-x)**2+(t.y-y)**2<(2*R)**2)}
function mv(o,dx,dy){if(!hit(o.x+dx,o.y,R)&&!tankHit(o,o.x+dx,o.y))o.x+=dx;if(!hit(o.x,o.y+dy,R)&&!tankHit(o,o.x,o.y+dy))o.y+=dy}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function los(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),n=d/8|0;for(let i=1;i<n;i++){if(wallAt(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n))return false}return true}
function build(){
 const r=mul(mission*7919+13);
 g=Array.from({length:RW},()=>Array(C).fill(0));
 const n=Math.min(8+mission*1.5,34)|0;
 for(let i=0;i<n;i++){const len=1+(r()*3|0),h=r()<.5,x=r()*C|0,y=r()*RW|0;
  for(let k=0;k<len;k++){const cx=x+(h?k:0),cy=y+(h?0:k);
   if(cx<C&&cy<RW&&(Math.abs(cx-2)>2||Math.abs(cy-12)>2))g[cy][cx]=1}}
 player={x:100,y:500,t:-.8,ba:0,dead:false,p:1,inv:0};
 enemies=[];bullets=[];mines=[];fx=[];wrecks=[];coinsArr=[];
 const cnt=Math.min(2+(mission*.9|0),9),maxT=Math.min(5,mission/2|0);
 for(let i=0;i<cnt;i++){
  for(let a=0;a<300;a++){
   const x=r()*W,y=r()*H;
   if(hit(x,y,R+4)||Math.hypot(x-player.x,y-player.y)<320||enemies.some(e=>Math.hypot(e.x-x,e.y-y)<80))continue;
   enemies.push({x,y,t:Math.PI,ba:0,type:r()*(maxT+1)|0,dead:false,cd:60+r()*60|0,mt:0,h:0,mc:300});break}}
}
function startMission(){coinsStart=coins;build();state='intro';timer=150}
function boom(x,y,s){fx.push({x,y,r:4,max:s})}
function kill(t){if(t.dead)return;t.dead=true;boom(t.x,t.y,40);wrecks.push({x:t.x,y:t.y});
 if(t.p){state='dead';timer=90}else{kills++;coinsArr.push({x:t.x,y:t.y,v:4+t.type*2})}}
function hurt(){
 if(player.dead||player.inv>0)return;
 if(shield>0){shield--;player.inv=60;boom(player.x,player.y,34)}else kill(player)}
function explode(b){
 if(b.o===player&&ups.explosive){boom(b.x,b.y,45);enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<45)kill(e)})}}
function shoot(o,sp,bn,mb){
 if(bullets.filter(b=>b.o===o).length>=mb)return false;
 bullets.push({x:o.x+Math.cos(o.t)*26,y:o.y+Math.sin(o.t)*26,vx:Math.cos(o.t)*sp,vy:Math.sin(o.t)*sp,n:0,max:bn,o,age:0});return true}
function ai(e){
 if(e.dead)return;const ty=TYPES[e.type],p=player;
 e.cd--;e.mt--;
 const want=Math.atan2(p.y-e.y,p.x-e.x);
 e.t+=Math.max(-.035,Math.min(.035,angDiff(want,e.t)));
 if(ty.sp){
  if(e.mt<=0){e.h=Math.random()<.35?want+(Math.random()-.5):Math.floor(Math.random()*8)*Math.PI/4;e.mt=60+Math.random()*120|0}
  const ox=e.x,oy=e.y;mv(e,Math.cos(e.h)*ty.sp,Math.sin(e.h)*ty.sp);e.ba=e.h;
  if(Math.abs(e.x-ox)+Math.abs(e.y-oy)<ty.sp*.3)e.mt=0}
 if(e.cd<=0&&!p.dead&&Math.abs(angDiff(want,e.t))<.12&&los(e,p)){if(shoot(e,ty.bs,ty.bn,ty.mb))e.cd=ty.cd+Math.random()*40}
 if(ty.ml&&--e.mc<=0){e.mc=300+Math.random()*300|0;if(mines.filter(m=>m.o===e).length<2)mines.push({x:e.x,y:e.y,t:540,o:e})}
}
function upd(){
 const p=player;
 if(p.inv>0)p.inv--;
 if(!p.dead){
  const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(dx||dy){const l=Math.hypot(dx,dy),s=2.2*(1+.1*ups.speed);mv(p,dx/l*s,dy/l*s);p.ba=Math.atan2(dy,dx)}
  p.t=Math.atan2(my-p.y,mx-p.x);
  enemies.forEach(ai);
  for(const c of coinsArr)if(Math.hypot(c.x-p.x,c.y-p.y)<R+8){coins+=c.v;c.got=1}
  coinsArr=coinsArr.filter(c=>!c.got)}
 for(const b of bullets){
  b.age++;
  let bx=wallAt(b.x+b.vx,b.y),by=wallAt(b.x,b.y+b.vy);
  if(!bx&&!by&&wallAt(b.x+b.vx,b.y+b.vy))bx=by=true;
  if(bx||by){if(b.n>=b.max){b.dead=true;explode(b);continue}b.n++;if(bx)b.vx*=-1;if(by)b.vy*=-1}
  b.x+=b.vx;b.y+=b.vy}
 for(let i=0;i<bullets.length;i++)for(let j=i+1;j<bullets.length;j++){
  const a=bullets[i],b=bullets[j];if(!a.dead&&!b.dead&&Math.hypot(a.x-b.x,a.y-b.y)<7){a.dead=b.dead=true;boom(a.x,a.y,10)}}
 for(const b of bullets){if(b.dead)continue;
  for(const t of alive()){if(b.o===t&&b.age<12)continue;
   if(t.p&&t.inv>0)continue;
   if(Math.hypot(b.x-t.x,b.y-t.y)<R+3){b.dead=true;if(t.p)hurt();else kill(t);explode(b);break}}}
 bullets=bullets.filter(b=>!b.dead);
 for(const m of mines){m.t--;if(m.t<=0){m.dead=true;boom(m.x,m.y,70);
  if(!player.dead&&Math.hypot(player.x-m.x,player.y-m.y)<70)hurt();
  enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x-m.x,e.y-m.y)<70)kill(e)})}}
 mines=mines.filter(m=>!m.dead);
 fx.forEach(f=>f.r+=(f.max-f.r)*.12+.4);fx=fx.filter(f=>f.r<f.max-.5);
}
function tick(){
 if(state==='play'){upd();
  if(!player.dead&&enemies.every(e=>e.dead)){state='win';timer=60;if(mission%5===0){lives++;bonus=true}else bonus=false}}
 else if(state==='dead'){upd();if(--timer<=0){lives--;state=lives>0?'lost':'over'}}
 else if(state==='win'){upd();if(--timer<=0){
  const left=coinsArr.reduce((s,c)=>s+c.v,0),bon=10+mission*2;
  gained=left+bon;coins+=gained;coinsArr=[];state='shop'}}
 else if(state==='intro'){if(--timer<=0)state='play'}
}
function adv(){
 if(state==='title')startMission();
 else if(state==='intro')state='play';
 else if(state==='lost'){coins=coinsStart;startMission()}
 else if(state==='shop'){mission++;startMission()}
 else if(state==='over'){mission=1;lives=3;kills=0;coins=0;shield=0;ups={bounce:0,ammo:0,bspeed:0,speed:0,explosive:0};startMission()}
}
/* ---------- drawing: black lines on white ---------- */
function drawTank(t,isPlayer){
 ctx.save();ctx.translate(t.x,t.y);
 ctx.save();ctx.rotate(t.ba||0);
 ctx.fillStyle='#fff';ctx.fillRect(-14,-10,28,20);ctx.strokeRect(-14,-10,28,20);
 ctx.beginPath();ctx.moveTo(-14,-5);ctx.lineTo(14,-5);ctx.moveTo(-14,5);ctx.lineTo(14,5);ctx.stroke();
 if(!isPlayer)for(let i=0;i<t.type;i++){ctx.beginPath();ctx.moveTo(-10+i*4,-2);ctx.lineTo(-10+i*4,2);ctx.stroke()}
 ctx.restore();
 ctx.rotate(t.t);
 ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(26,0);ctx.stroke();
 ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fillStyle=isPlayer?'#000':'#fff';ctx.fill();ctx.stroke();
 ctx.restore()}
function txt(s,x,y,sz,al){ctx.fillStyle='#000';ctx.font='bold '+sz+'px monospace';ctx.textAlign=al||'center';ctx.fillText(s,x,y)}
function overlay(a,b,c){
 ctx.fillStyle='#fff';ctx.fillRect(150,H/2-80,500,160);ctx.strokeRect(150,H/2-80,500,160);
 txt(a,W/2,H/2-25,34);txt(b,W/2,H/2+10,16);if(c)txt(c,W/2,H/2+50,13)}
function drawField(){
 if(!g){txt('TANKS!',W/2,H/2-10,72);txt('Click to start',W/2,H/2+40,20);txt('Destroy every enemy tank. Collect coins, buy upgrades.',W/2,H/2+75,14);return}
 wrecks.forEach(w=>{ctx.beginPath();ctx.moveTo(w.x-9,w.y-9);ctx.lineTo(w.x+9,w.y+9);ctx.moveTo(w.x+9,w.y-9);ctx.lineTo(w.x-9,w.y+9);ctx.stroke()});
 for(let y=0;y<RW;y++)for(let x=0;x<C;x++)if(g[y][x]){
  ctx.strokeRect(x*T+1,y*T+1,T-2,T-2);
  ctx.beginPath();ctx.moveTo(x*T+1,y*T+1);ctx.lineTo(x*T+T-1,y*T+T-1);ctx.stroke()}
 coinsArr.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,7,0,7);ctx.stroke();ctx.beginPath();ctx.arc(c.x,c.y,3,0,7);ctx.stroke()});
 mines.forEach(m=>{ctx.beginPath();ctx.arc(m.x,m.y,8,0,7);ctx.stroke();
  if(!(m.t<120&&(m.t/8|0)%2)){ctx.beginPath();ctx.moveTo(m.x-5,m.y);ctx.lineTo(m.x+5,m.y);ctx.moveTo(m.x,m.y-5);ctx.lineTo(m.x,m.y+5);ctx.stroke()}});
 enemies.forEach(e=>{if(!e.dead)drawTank(e,false)});
 if(!player.dead){
  if(!(player.inv>0&&(player.inv/4|0)%2))drawTank(player,true);
  if(shield>0){ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(player.x,player.y,22,0,7);ctx.stroke();ctx.setLineDash([])}}
 ctx.fillStyle='#000';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill();
  if(b.o===player&&ups.explosive){ctx.beginPath();ctx.arc(b.x,b.y,6,0,7);ctx.stroke()}});
 fx.forEach(f=>{ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.stroke();ctx.beginPath();ctx.arc(f.x,f.y,f.r*.5,0,7);ctx.stroke()});
 if(state==='play'&&!player.dead){ctx.lineWidth=1;ctx.beginPath();ctx.arc(mx,my,7,0,7);ctx.moveTo(mx-11,my);ctx.lineTo(mx+11,my);ctx.moveTo(mx,my-11);ctx.lineTo(mx+0,my+11);ctx.stroke();ctx.lineWidth=2}
 if(state==='intro')overlay('Mission '+mission,'Enemy tanks: '+enemies.length,'Click or press Enter to begin');
 if(state==='lost')overlay('Tank destroyed','Lives left: '+lives,'Click to retry Mission '+mission);
 if(state==='over')overlay('Game over','Reached Mission '+mission+' with '+kills+' kills','Click to play again');
}
const ROW0=120,ROWH=48;
function drawShop(){
 txt('MISSION '+mission+' CLEARED',W/2,70,30);
 txt((bonus?'Bonus life earned!  ':'')+'Coins collected: +'+gained+'     Wallet: '+coins,W/2,100,16);
 ITEMS.forEach((it,i)=>{
  const y=ROW0+i*ROWH,ok=canBuy(it),max=lvl(it)>=it.max;
  ctx.setLineDash(ok?[]:[6,5]);ctx.strokeRect(100,y,600,44);ctx.setLineDash([]);
  txt((i+1)+'. '+it.n,112,y+19,16,'left');txt(it.d,112,y+37,12,'left');
  txt(max?'MAX':'Cost: '+cost(it),688,y+19,16,'right');
  txt(it.k==='shield'?'Owned: '+shield:it.k==='life'?'Lives: '+lives:'Level '+ups[it.k]+'/'+it.max,688,y+37,12,'right')});
 ctx.strokeRect(300,486,200,44);txt('Continue ▶',W/2,514,18);
 txt('Enter / Space to continue',W/2,562,12)}
function draw(){
 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.lineJoin='round';
 /* HUD (separate from the arena) */
 ctx.beginPath();ctx.moveTo(0,OY-1);ctx.lineTo(W,OY-1);ctx.stroke();
 if(g){
  txt('Mission '+mission+'  Enemies: '+enemies.filter(e=>!e.dead).length+'  Coins: '+coins,10,26,14,'left');
  txt('Lives: '+lives+'  Shield: '+shield+'  Kills: '+kills,W-10,26,14,'right')}
 if(state==='shop'){drawShop();return}
 ctx.save();ctx.translate(0,OY);
 ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
 drawField();
 ctx.restore();
 ctx.strokeRect(1,OY+1,W-2,H-2);
}
/* ---------- fixed 60 Hz timestep (same speed on any monitor) ---------- */
const STEP=1000/60;let last=performance.now(),acc=0;
function loop(now){
 acc+=Math.min(now-last,250);last=now;
 while(acc>=STEP){tick();acc-=STEP}
 draw();requestAnimationFrame(loop)}
function pos(e){const r=cv.getBoundingClientRect();rawX=(e.clientX-r.left)*cv.width/r.width;rawY=(e.clientY-r.top)*cv.height/r.height;mx=rawX;my=rawY-OY}
function layMine(){if(state==='play'&&!player.dead&&mines.filter(m=>m.o===player).length<2)mines.push({x:player.x,y:player.y,t:540,o:player})}
cv.addEventListener('mousemove',pos);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('mousedown',e=>{pos(e);
 if(state==='shop'){
  if(rawX>=100&&rawX<=700&&rawY>=ROW0&&rawY<ROW0+ITEMS.length*ROWH){const i=Math.floor((rawY-ROW0)/ROWH);if(rawY-ROW0-i*ROWH<44)buy(i)}
  else if(rawX>=300&&rawX<=500&&rawY>=486&&rawY<=530)adv();
  return}
 if(state==='play'&&!player.dead){
  if(e.button===2)layMine();else shoot(player,4*(1+.25*ups.bspeed),1+ups.bounce,5+ups.ammo)}
 else adv()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;
 if(state==='shop'&&k>='1'&&k<='7'){buy(+k-1);return}
 if(k===' '){e.preventDefault();state==='play'?layMine():adv()}
 if(k==='enter')adv();
 if(k.startsWith('arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
addEventListener('blur',()=>{keys={}});
requestAnimationFrame(loop);
</script></body></html>
